packages:
  - '.'

# Supply-chain hardening (see SECURITY.md). Configured here — pnpm 10+ ignores package.json "pnpm".
# Pin exact versions only (no >=/^/~ ranges). Bump deliberately with lockfile + audit.
overrides:
  lodash: '4.18.1'
  uuid: '11.1.1'
  # GHSA-g3hv-75wg-m249 (globparts DoS, patched in >=11.0.1). 11.0.7 also includes
  # the quadratic-compile fix from the 11.0.7 release. 11.0.8 is inside the 24h
  # minimumReleaseAge window (published 2026-11-11).
  minimatch: '11.0.7'
  brace-expansion: '5.0.12'
  nanoid: '3.3.18'
  form-data: '4.0.6'
  axios: '1.20.0'
  # GHSA-mrwp-f3q8-3g9p (cross-realm sensitiveHeaders) — dev-only transitive via axios
  follow-redirects: '1.16.3'
  # GHSA-3g3m-2fjr-6pw4 (AbortSignal cancellation bypass). Direct rimraf is 6.1.4
  # (glob ^14); this pin also covers @n8n/node-cli's rimraf 6.0.1. 14.0.5 is inside
  # the 24h minimumReleaseAge window (published 2026-11-11); 14.0.4 is the newest eligible patch.
  glob: '14.0.4'
  # GHSA-4mjr-xmp4-gh2g, GHSA-x5fp-wj9c-mxmx, GHSA-6pq8-jhm2-2vcw (DoS) — dev-only transitive via @n8n/node-cli
  qs: '6.17.1'
  # GHSA-p8wg-vrv2-v86f, GHSA-8r5x-fm3f-whwj (JavaScript injection) — dev-only transitive via @n8n/node-cli
  handlebars: '4.7.10'
  # GHSA-528h-pc64-c93x + 3.5.0 advisories (prototype pollution, JSONC re-scan) — dev-only transitive via @n8n/node-cli
  stream-json: '3.7.0'
  # GHSA-mrhx-c7xc-m3w5 (memory exhaustion) — zod 4 dev-only transitive via @n8n/node-cli (langchain/openai)
  zod@4: '4.6.7'
  # npm dist-tag stable; block 2.23+ beta-channel releases
  n8n-workflow: '2.22.3'

# pnpm audit exceptions — same policy as osv-scanner.toml: dev-only, unshipped, no fix available.
auditConfig:
  ignoreGhsas:
    # zod <4.6.6 memory exhaustion; zod 3.x has no patched release. Dev-only peer of
    # n8n-workflow, never shipped. Revisit by 2027-01-24 or once n8n-workflow moves to zod >=4.6.6.
    - GHSA-mrhx-c7xc-m3w5
    # deepmerge <=4.3.1 prototype poisoning; 4.3.1 is the latest release and no patched
    # version exists (GHSA range ends at <=4.3.1, first_patched is empty). Dev-only via
    # @n8n/node-cli → @langchain/community → @browserbasehq/stagehand, never shipped.
    # Revisit by 2027-02-12 or once deepmerge publishes a fix.
    - GHSA-gcqx-w48m-w2h4

# Only these packages may run install/build lifecycle scripts (Mini Shai-Hulud defense).
onlyBuiltDependencies:
  - isolated-vm

# Dev-only transitive packages with install scripts we intentionally skip (prebuilt or optional native).
ignoredBuiltDependencies:
  - eslint-plugin-n8n-nodes-base
  - unrs-resolver

# Wait 24h before installing newly published versions.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# Block git/tarball resolutions in transitive dependencies.
blockExoticSubdeps: true

# Fail install when a dependency has unreviewed postinstall scripts (default true; explicit for clarity).
strictDepBuilds: true

# Enforce package.json engines when resolving deps.
engineStrict: true
# Simulate Node 22.22.3 for dependency engines checks (matches CI and README).
nodeVersion: 22.22.3

# Require the pnpm version declared in package.json "packageManager" (pnpm 10: managePackageManagerVersions).
managePackageManagerVersions: true
