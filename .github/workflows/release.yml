# Publish to npm using OIDC trusted publishing (configure on npmjs.com for this package).
# Fallback: set repository secret NPM_TOKEN if OIDC is not configured yet.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Supply chain check
        run: pnpm run audit:supply-chain

      - name: Build
        run: pnpm run build

      - name: Lint (prepublish rules)
        run: pnpm exec eslint -c .eslintrc.prepublish.js nodes credentials package.json

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
